<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceremonial Dashboard - Executive Overview 2026</title>
  <meta name="description" content="Dashboard Ceremonial Interaktif - Sales, KPI, OKR, Complain, & Milestone Tracking">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>

<body class="dark-theme">
  <!-- Background Glow & Animated Particles Container -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <div class="app-layout">
    <!-- Top Navigation Header -->
    <header class="top-header">
      <div class="header-left-group" style="display:flex; align-items:center; gap:10px;">
        <button class="btn-hamburger" id="mobileNavToggle" title="Buka Menu Navigasi" aria-label="Toggle Navigation">
          <i data-lucide="menu" id="hamburgerIcon"></i>
        </button>

        <div class="header-brand" style="display:flex; align-items:center; gap:12px;">
          <div class="brand-logos-container"
            style="display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.04); padding:4px 8px; border-radius:12px; border:1px solid rgba(255,255,255,0.1);">
            <img src="asset/bt trusmi logo.webp" alt="BT Batik Trusmi Logo"
              style="height:36px; width:auto; object-fit:contain; filter:drop-shadow(0 0 6px rgba(245,158,11,0.3));" />
            <div style="width:1px; height:22px; background:rgba(255,255,255,0.2);"></div>
            <img src="asset/keranjang bali.png" alt="The Keranjang Bali Logo"
              style="height:36px; width:auto; object-fit:contain; filter:drop-shadow(0 0 6px rgba(6,182,212,0.3));" />
          </div>
          <div class="brand-titles">
            <h1>CEREMONIAL DASHBOARD</h1>
            <span class="brand-subtitle">Executive Performance & Milestone Portal 2026 — Batik Trusmi & The Keranjang
              Bali</span>
          </div>
        </div>
      </div>

      <div class="header-controls">
        <div class="time-display" id="liveClock">
          <i data-lucide="clock" class="icon-sm"></i>
          <span id="clockTime">--:--:--</span>
        </div>

        <div class="period-selector">
          <i data-lucide="calendar" class="icon-sm"></i>
          <select id="periodSelect">
            <option value="ytd2026" selected>YTD 2026 (Jan–Ags)</option>
            <option value="agustus_2026">Agustus 2026 (Data Baru ✨)</option>
            <option value="juli_2026">Juli 2026 (History 📜)</option>
            <option value="q3_2026">Q3 2026</option>
            <option value="q2_2026">Q2 2026</option>
            <option value="q1_2026">Q1 2026</option>
          </select>
        </div>

        <!-- Dark / Light Theme Toggle -->
        <button class="btn-theme-toggle" id="themeToggleBtn" title="Ganti Mode Gelap / Terang" aria-label="Toggle Dark/Light Mode">
          <i data-lucide="sun" class="icon-sm" id="themeToggleIcon"></i>
          <span id="themeToggleText">Light</span>
        </button>

        <button class="btn-ceremony" id="btnCelebrate" title="Rayakan Pencapaian!">
          <i data-lucide="sparkles" class="icon-sparkle"></i>
          <span>Selebrasi!</span>
        </button>
      </div>
    </header>

    <!-- Overlay backdrop for mobile drawer navigation -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Container with Sidebar Navigation + Content Area -->
    <div class="main-body">
      <!-- Left Navigation Menu -->
      <nav class="sidebar-nav">
        <div class="nav-section-title">KATEGORI UTAMA</div>

        <ul class="nav-list">
          <!-- 1. Sales YTD -->
          <li class="nav-item">
            <button class="nav-link active" data-category="sales-ytd" id="nav-sales-ytd">
              <div class="nav-icon-wrapper sales-theme">
                <i data-lucide="trending-up"></i>
              </div>
              <div class="nav-text">
                <span class="nav-title">Sales YTD</span>
                <span class="nav-badge direct">Direct View</span>
              </div>
            </button>
          </li>

          <!-- 2. KPI Performance (with Subcategories) -->
          <li class="nav-item has-sub">
            <button class="nav-link nav-parent" data-category="kpi-performance" id="nav-kpi-performance">
              <div class="nav-icon-wrapper kpi-theme">
                <i data-lucide="award"></i>
              </div>
              <div class="nav-text">
                <span class="nav-title">KPI Performance</span>
                <span class="nav-badge count">2 Sub</span>
              </div>
              <i data-lucide="chevron-down" class="chevron-icon"></i>
            </button>
            <ul class="sub-nav-list" id="subnav-kpi">
              <li>
                <button class="sub-link" data-category="kpi-performance" data-sub="kpi-bt" id="nav-kpi-bt">
                  <span class="dot-indicator"></span>
                  <span>KPI BT</span>
                </button>
              </li>
              <li>
                <button class="sub-link" data-category="kpi-performance" data-sub="kpi-tkb" id="nav-kpi-tkb">
                  <span class="dot-indicator"></span>
                  <span>KPI TKB</span>
                </button>
              </li>
            </ul>
          </li>

          <!-- 3. Head to Head (Direct View) -->
          <li class="nav-item">
            <button class="nav-link" data-category="head-to-head" id="nav-head-to-head">
              <div class="nav-icon-wrapper h2h-theme">
                <i data-lucide="swords"></i>
              </div>
              <div class="nav-text">
                <span class="nav-title">Head to Head</span>
                <span class="nav-badge direct">Direct View</span>
              </div>
            </button>
          </li>

          <!-- 4. OKR (with Subcategories) -->
          <li class="nav-item has-sub">
            <button class="nav-link nav-parent" data-category="okr" id="nav-okr">
              <div class="nav-icon-wrapper okr-theme">
                <i data-lucide="target"></i>
              </div>
              <div class="nav-text">
                <span class="nav-title">OKR</span>
                <span class="nav-badge count">4 Sub</span>
              </div>
              <i data-lucide="chevron-down" class="chevron-icon"></i>
            </button>
            <ul class="sub-nav-list" id="subnav-okr">
              <li>
                <button class="sub-link" data-category="okr" data-sub="okr-bt" id="nav-okr-bt">
                  <span class="dot-indicator"></span>
                  <span>OKR BT</span>
                </button>
              </li>
              <li>
                <button class="sub-link" data-category="okr" data-sub="okr-tkb" id="nav-okr-tkb">
                  <span class="dot-indicator"></span>
                  <span>OKR TKB</span>
                </button>
              </li>
              <li>
                <button class="sub-link" data-category="okr" data-sub="okr-prodev" id="nav-okr-prodev">
                  <span class="dot-indicator"></span>
                  <span>OKR PRODEV</span>
                </button>
              </li>
              <li>
                <button class="sub-link" data-category="okr" data-sub="okr-produksi" id="nav-okr-produksi">
                  <span class="dot-indicator"></span>
                  <span>OKR PRODUKSI</span>
                </button>
              </li>
            </ul>
          </li>

          <!-- 5. Complain (with Subcategories) -->
          <li class="nav-item has-sub">
            <button class="nav-link nav-parent" data-category="complain" id="nav-complain">
              <div class="nav-icon-wrapper complain-theme">
                <i data-lucide="message-square-warning"></i>
              </div>
              <div class="nav-text">
                <span class="nav-title">Complain</span>
                <span class="nav-badge count">2 Sub</span>
              </div>
              <i data-lucide="chevron-down" class="chevron-icon"></i>
            </button>
            <ul class="sub-nav-list" id="subnav-complain">
              <li>
                <button class="sub-link" data-category="complain" data-sub="complain-bt" id="nav-complain-bt">
                  <span class="dot-indicator"></span>
                  <span>Complain BT</span>
                </button>
              </li>
              <li>
                <button class="sub-link" data-category="complain" data-sub="complain-tkb" id="nav-complain-tkb">
                  <span class="dot-indicator"></span>
                  <span>Complain TKB</span>
                </button>
              </li>
            </ul>
          </li>

          <!-- 6. Milestone (with Subcategories) -->
          <li class="nav-item has-sub">
            <button class="nav-link nav-parent" data-category="milestone" id="nav-milestone">
              <div class="nav-icon-wrapper milestone-theme">
                <i data-lucide="milestone"></i>
              </div>
              <div class="nav-text">
                <span class="nav-title">Milestone</span>
                <span class="nav-badge count">2 Sub</span>
              </div>
              <i data-lucide="chevron-down" class="chevron-icon"></i>
            </button>
            <ul class="sub-nav-list" id="subnav-milestone">
              <li>
                <button class="sub-link" data-category="milestone" data-sub="milestone-bt" id="nav-milestone-bt">
                  <span class="dot-indicator"></span>
                  <span>Milestone BT</span>
                </button>
              </li>
              <li>
                <button class="sub-link" data-category="milestone" data-sub="milestone-tkb" id="nav-milestone-tkb">
                  <span class="dot-indicator"></span>
                  <span>Milestone TKB</span>
                </button>
              </li>
            </ul>
          </li>

          <!-- 7. B2B (with Subcategories) - Hidden by default -->
          <li class="nav-item has-sub" id="navItemB2B" style="display: none;">
            <button class="nav-link nav-parent" data-category="b2b" id="nav-b2b">
              <div class="nav-icon-wrapper b2b-theme">
                <i data-lucide="handshake"></i>
              </div>
              <div class="nav-text">
                <span class="nav-title">B2B</span>
                <span class="nav-badge count">3 Sub</span>
              </div>
              <i data-lucide="chevron-down" class="chevron-icon"></i>
            </button>
            <ul class="sub-nav-list" id="subnav-b2b">
              <li>
                <button class="sub-link" data-category="b2b" data-sub="b2b-achievement" id="nav-b2b-achievement">
                  <span class="dot-indicator"></span>
                  <span>Achievement B2B</span>
                </button>
              </li>
              <li>
                <button class="sub-link" data-category="b2b" data-sub="b2b-comparison" id="nav-b2b-comparison">
                  <span class="dot-indicator"></span>
                  <span>Perbandingan YoY</span>
                </button>
              </li>
              <li>
                <button class="sub-link" data-category="b2b" data-sub="b2b-complain" id="nav-b2b-complain">
                  <span class="dot-indicator"></span>
                  <span>Complain B2B</span>
                </button>
              </li>
            </ul>
          </li>

          <!-- Fitur Hide / Tampilkan Kategori Besar B2B -->
          <li class="nav-item" id="navToggleB2BItem" style="margin-top: 4px;">
            <button class="nav-link" id="btnToggleB2B" onclick="toggleB2BModuleVisibility()" style="background: rgba(99, 102, 241, 0.08); border: 1px dashed rgba(99, 102, 241, 0.35); cursor: pointer;" title="Tampilkan / Sembunyikan Kategori Besar B2B">
              <div class="nav-icon-wrapper" style="background: rgba(99, 102, 241, 0.18); color: #818CF8;">
                <i data-lucide="eye" id="iconToggleB2B"></i>
              </div>
              <div class="nav-text">
                <span class="nav-title" id="textToggleB2B" style="font-size: 0.8rem; font-weight: 700; color: #C7D2FE;">Tampilkan B2B</span>
                <span class="nav-badge" id="badgeToggleB2B" style="background: rgba(99, 102, 241, 0.25); color: #A5B4FC; font-size: 0.65rem;">Hidden</span>
              </div>
            </button>
          </li>
        </ul>

        <!-- Sidebar Summary Widget -->
        <div class="sidebar-summary-card">
          <div class="summary-card-header">
            <i data-lucide="shield-check" class="summary-icon"></i>
            <span>Health Index</span>
          </div>
          <div class="summary-score">96.4%</div>
          <div class="summary-progress-bar">
            <div class="bar-fill" style="width: 96.4%"></div>
          </div>
          <div class="summary-footer">Performa Operasional Prima</div>
        </div>
      </nav>

      <!-- Main Content Viewport -->
      <main class="content-viewport" id="contentViewport">
        <!-- Content headers and sub-tabs are dynamically updated -->
        <div class="content-header-bar">
          <div class="header-path">
            <span class="path-root" id="currentCategoryTitle">Sales YTD</span>
            <i data-lucide="chevron-right" class="path-divider" id="pathDivider"></i>
            <span class="path-sub" id="currentSubTitle" style="display:none;"></span>
          </div>

          <!-- Dynamic Subcategory Pills Header (visible when a category has subcategories) -->
          <div class="sub-pills-bar" id="subPillsBar" style="display:none;">
            <!-- Rendered by JS -->
          </div>

          <div class="content-actions">
            <div class="search-box">
              <i data-lucide="search"></i>
              <input type="text" id="searchInput" placeholder="Cari metric, OKR, ticket, milestone...">
            </div>
            <button class="btn-refresh" id="btnRefreshData" title="Refresh Data">
              <i data-lucide="rotate-cw"></i>
            </button>
          </div>
        </div>

        <!-- Dynamic Page Render Target -->
        <div class="dynamic-container" id="dynamicContent">
          <!-- Views will be injected via app.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card">
      <button class="modal-close" id="modalCloseBtn">
        <i data-lucide="x"></i>
      </button>
      <div class="modal-header" id="modalHeader">
        <!-- Injected -->
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Injected -->
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modalActionClose">Tutup</button>
        <button class="btn-primary" id="modalActionCelebrate">
          <i data-lucide="sparkles"></i> Celebrate Achievement
        </button>
      </div>
    </div>
  </div>

  <!-- B2B Complain Photo & Video Lightbox Modal -->
  <div class="b2b-lightbox" id="b2bLightbox" onclick="closeB2BLightbox(event)">
    <div class="b2b-lightbox-content" onclick="event.stopPropagation()">
      <button class="b2b-lightbox-close" onclick="closeB2BLightbox()" title="Tutup Modal" aria-label="Close modal">
        <i data-lucide="x"></i>
      </button>
      <div id="b2bLightboxInner">
        <!-- Injected by openB2BPhotoModal -->
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>

</html>
